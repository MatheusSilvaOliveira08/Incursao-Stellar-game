<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <title>Incursão Stellar</title>
</head>
<body>
    <section class="score-ui">
        <div>
            <span class="score">score: <span>0</span></span>
            <span class="level">level: <span>1</span></span>
            <span class="high">high: <span>0</span></span>
        </div>
    </section>

    <section class="start-screen screen">
        <div>
            <h1>Incursão Stellar</h1>
            <button class="button-play">Play</button>
        </div>

        <span></span>
    </section>

    <section class="game-over screen">
        <div>
            <h1>Game Over</h1>
            <button class="button-restart">Restart</button>
            <button class="button-ranking">Ranking</button>
        </div>
    </section>

    <section class="ranking-screen screen">
        <div class="ranking-content">
            <div class="ranking">
                <h2>Ranking</h2>
                <div class="ranking-scroll">
                    <table class="ranking-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Pontos</th>
                                <th>Resultado</th>
                                <th>Data</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <button class="button-restart-ranking">Restart</button>
        </div>
    </section>

    <section class="win-screen screen">
        <div class="win-content">
            <h1 class="win-title">Você Venceu!</h1>

            <div class="ranking">
                <h2>Ranking</h2>
                <div class="ranking-scroll">
                    <table class="ranking-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Pontos</th>
                                <th>Resultado</th>
                                <th>Data</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <button class="button-restart-win">Jogar de novo</button>
        </div>
    </section>

    <canvas></canvas>

    <script type="module" src="src/index.js"></script>
</body>
</html>
